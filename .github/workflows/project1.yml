name: Project 1 analytic validation

on:
  push:
    paths:
      - 'code/project1/**'
      - 'notes/project1/**'
      - 'report/project1/**'
      - 'figures/project1/**'
      - '.github/workflows/project1.yml'
  pull_request:
    paths:
      - 'code/project1/**'
      - '.github/workflows/project1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/project1/requirements.txt
      - name: Install Project 1 dependencies
        run: python -m pip install -r code/project1/requirements.txt
      - name: Independent analytic and special-case checks
        run: python code/project1/code/validation_tests.py
      - name: Verify recorded deliverable checksums
        run: python notes/project1/verify_archive.py
